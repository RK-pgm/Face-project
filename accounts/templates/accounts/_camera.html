<section class="camera-card" aria-label="Camera verification">
  <span class="eyebrow camera-kicker">Face verification</span>
  <h2>Center your face</h2>
  <p class="camera-intro">Use a bright, even light and look straight at the camera.</p>
  <div class="camera-frame">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <div class="camera-placeholder" id="camera-placeholder">
      Preparing the camera and face models…
    </div>
  </div>
  <div class="d-flex justify-content-end py-2">
    <button class="btn btn-outline-secondary btn-sm" type="button" id="switch-camera-btn" disabled>
      Switch camera
    </button>
  </div>

  <p class="face-status" id="face-status" role="status" aria-live="polite" data-state="idle">
    Loading face models…
  </p>
</section>

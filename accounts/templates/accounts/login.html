{% extends "accounts/base.html" %}
{% load static %}

{% block title %}Sign in{% endblock %}

{% block content %}
  <div class="auth-layout auth-layout--sign-in">
    <div class="auth-form-column">
      <div class="panel">
        <h1 class="auth-card-title">Member sign-in</h1>
        <p class="auth-card-copy">
          Confirm your name and PIN while the camera checks your face.
        </p>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input
              class="form-control"
              id="name"
              name="name"
              type="text"
              maxlength="50"
              autocomplete="username"
              required
            >
          </div>

          <div class="mb-3">
            <label class="form-label" for="pin">PIN (4–6 digits)</label>
            <input
              class="form-control"
              id="pin"
              name="pin"
              type="password"
              inputmode="numeric"
              maxlength="6"
              autocomplete="current-password"
              required
            >
          </div>

          <div id="result" class="result-box error mb-3" role="alert" hidden></div>
          <button class="btn btn-primary w-100" id="submit-btn" type="submit" disabled>
            Scan face and sign in
          </button>
        </form>

        <p class="auth-footer">
          New here? <a href="{% url 'register' %}">Register</a>
        </p>
      </div>
    </div>

    <div class="auth-camera-column">
      {% include "accounts/_camera.html" %}
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{% static 'vendor/face-api/face-api.js' %}"></script>
  <script src="{% static 'accounts/js/common.js' %}?v=20261012-camera-deviceid"></script>
  <script src="{% static 'accounts/js/login.js' %}?v=20261012-camera-deviceid2"></script>
{% endblock %}
